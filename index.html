<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SprintDesk sprint management dashboard" />
    <link rel="preconnect" href="https://dummyjson.com" crossorigin />
    <link rel="preconnect" href="https://jsonplaceholder.typicode.com" crossorigin />
    <link rel="dns-prefetch" href="https://i.pravatar.cc" />
    <title>SprintDesk</title>
    <script>
      try {
        var theme = localStorage.getItem('sprintdesk-theme');
        if (theme && theme.indexOf('"dark"') !== -1) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
